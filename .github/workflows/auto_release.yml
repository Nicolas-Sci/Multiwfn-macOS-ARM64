name: Auto Compile & Release Multiwfn (macOS ARM64)

on:
  schedule:
    - cron: '0 2 * * 1' # Check every Monday at 02:00 UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  check-and-build:
    runs-on: macos-14 # Apple Silicon M1 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Download latest Multiwfn source
        run: |
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36" http://sobereva.com/multiwfn/misc/Multiwfn_latest_src_Linux.zip -o Multiwfn_latest_src_Linux.zip
          unzip -q Multiwfn_latest_src_Linux.zip -d extracted_zip
          mv extracted_zip/Multiwfn_*_src_Linux src_dir
          
      - name: Extract Version
        id: get_version
        run: |
          # Find the version string in Multiwfn.f90
          VERSION_LINE=$(grep -i "Version " src_dir/Multiwfn.f90 | head -n 1)
          VERSION=$(echo "$VERSION_LINE" | grep -o '20[0-9][0-9]\.[0-9]*\.[0-9]*' | head -n 1)
          echo "Extracted version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "Failed to extract version!"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
      - name: Check if release already exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v${{ env.VERSION }} > /dev/null 2>&1; then
            echo "Release v${{ env.VERSION }} already exists. Skipping build."
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
          else
            echo "New version detected. Proceeding with build."
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
          fi

      - name: Install Dependencies
        if: env.SKIP_BUILD == 'false'
        run: |
          # Uninstall existing conflicting packages on runner if needed, though usually clean
          brew update
          brew install gcc cmake openblas flint dylibbundler

      - name: Compile Multiwfn
        if: env.SKIP_BUILD == 'false'
        run: |
          cp CMakeLists.txt src_dir/
          cd src_dir
          export FC=/opt/homebrew/bin/gfortran
          export CC=/opt/homebrew/bin/gcc-$($FC -dumpversion | cut -d. -f1)
          
          # Fix non-standard Fortran in frj.f90 that breaks gfortran
          sed -i.bak 's/open(81,status="replace")/open(81,file="fort.81",status="replace")/g' ext/frj.f90 || true
          
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_OpenMP=ON -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/openblas"
          cmake --build build -j 4
          
      - name: Package Release
        if: env.SKIP_BUILD == 'false'
        run: |
          RELEASE_DIR="Multiwfn_${{ env.VERSION }}_macOS_ARM64_noGUI"
          mkdir $RELEASE_DIR
          cp src_dir/build/multiwfn $RELEASE_DIR/Multiwfn
          cp src_dir/settings.ini $RELEASE_DIR/
          
          # Bundle dynamic libraries to make the executable fully portable
          # -p must match the -d folder relative to the executable
          dylibbundler -od -b -x $RELEASE_DIR/Multiwfn -d $RELEASE_DIR/lib/ -p @executable_path/lib/
          
          # Deduplicate LC_RPATH entries created by dylibbundler to prevent dyld abort on macOS 15+
          python3 - << 'EOF'
          import subprocess, re, glob, os

          def deduplicate_rpaths(filepath):
              if not os.path.exists(filepath):
                  return
              out = subprocess.check_output(["otool", "-l", filepath], text=True)
              pattern = r'cmd LC_RPATH\s+cmdsize \d+\s+path (.*?) \(offset \d+\)'
              rpaths = re.findall(pattern, out)
              seen = {}
              for r in rpaths:
                  seen[r] = seen.get(r, 0) + 1
              modified = False
              for r, count in seen.items():
                  if count > 1:
                      for _ in range(count - 1):
                          subprocess.check_call(["install_name_tool", "-delete_rpath", r, filepath])
                          modified = True
              if modified:
                  subprocess.check_call(["codesign", "--force", "-s", "-", filepath])

          release_dir = "Multiwfn_${{ env.VERSION }}_macOS_ARM64_noGUI"
          deduplicate_rpaths(f"{release_dir}/Multiwfn")
          for dylib in glob.glob(f"{release_dir}/lib/*.dylib"):
              deduplicate_rpaths(dylib)
          EOF

          # Smoke test: fail the build if any Homebrew path remains or the binary cannot start
          if otool -L $RELEASE_DIR/Multiwfn $RELEASE_DIR/lib/*.dylib | grep -E "/opt/homebrew|\.\./libs/"; then
            echo "Unbundled or wrong library paths found"; exit 1
          fi
          echo q | env -i PATH=/usr/bin:/bin $RELEASE_DIR/Multiwfn > smoke.log 2>&1 || true
          cat smoke.log
          grep -q "Multifunctional Wavefunction Analyzer" smoke.log
          
          # Replace versions in READMEs
          sed "s/\[VERSION\]/${{ env.VERSION }}/g" README_macOS.md > $RELEASE_DIR/README_macOS.md
          sed "s/\[VERSION\]/${{ env.VERSION }}/g" README_macOS_CN.md > $RELEASE_DIR/README_macOS_CN.md
          
          zip -r $RELEASE_DIR.zip $RELEASE_DIR

      - name: Create GitHub Release
        if: env.SKIP_BUILD == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import urllib.request, re, os
          from html import unescape

          version = os.environ.get("VERSION", "latest")
          url = "http://sobereva.com/multiwfn/update.html"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          changelog_text = ""
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')
              pattern = rf'<li>\s*(\[{re.escape(version)}.*?\].*?)</li>'
              matches = re.findall(pattern, html, flags=re.DOTALL | re.IGNORECASE)
              items = []
              for m in matches:
                  text = re.sub(r'<[^>]+>', '', m)
                  text = unescape(text)
                  text = ' '.join(text.split())
                  items.append(f"- {text}")
              if items:
                  changelog_text = "\n".join(items)
          except Exception as e:
              print(f"Warning: could not fetch changelog: {e}")

          if not changelog_text:
              changelog_text = f"- Upstream update {version}. For complete details, see [Update History](http://sobereva.com/multiwfn/update.html)."

          notes = f"""## Multiwfn {version} for macOS (Apple Silicon / ARM64)

          > [!NOTE]
          > **Portable Release / 绿色便携版**  
          > All required runtime dynamic libraries (OpenBLAS, GCC OpenMP, Flint, GMP, MPFR) are bundled within the `lib/` directory. Zero dependencies required—no Homebrew, package managers, or compilers needed.  
          > 本版本为开箱即用的绿色便携包，已内嵌所有动态依赖库（OpenBLAS、Flint、GMP 等），本地无需通过 Homebrew 安装任何编译环境。

          ---

          ### 🚀 Upstream Highlights / 官方更新日志

          {changelog_text}

          *Full update history: [http://sobereva.com/multiwfn/update.html](http://sobereva.com/multiwfn/update.html)*

          ---

          ### 🛠️ Build Environment & Specifications / 编译环境与参数

          | Item / 项目 | Details / 详细信息 |
| :--- | :--- |
| **Target OS / 目标系统** | macOS 14+ (ARM64 / Apple Silicon) |
| **Supported Hardware / 硬件支持** | Apple Silicon M1 / M2 / M3 / M4 / M5 / M6 (Base / Pro / Max / Ultra) |
| **Compiler / 编译器** | GNU Fortran 16.2.0 (Homebrew GCC) |
| **Linear Algebra / 数学库** | OpenBLAS 0.3.34 (multi-threaded acceleration) |
| **Number Theory & Poly / 多精度数学** | Flint 3.6.0, GMP 6.3.0, MPFR 4.2.2 |
| **Parallelization / 并行加速** | OpenMP multi-threading enabled |
| **Interface / 界面形式** | noGUI (Command-line / 终端交互模式) |
| **Packaging / 打包形态** | Self-contained portable bundle (RPATH fixed & signed) |

          ---

          ### 📖 Quick Setup Guide / 安装与运行指引

          #### 1. Extract and Relocate / 解压与放置
          Download and extract the ZIP package. Move or rename the folder to a persistent location (e.g., `Multiwfn_macOS`):
          ```bash
          # Example: place in ~/Software/Multiwfn_macOS
          mkdir -p ~/Software
          mv Multiwfn_{version}_macOS_ARM64_noGUI ~/Software/Multiwfn_macOS
          ```
          > [!IMPORTANT]
          > The `Multiwfn` binary and the `lib/` directory must remain in the same folder.  
          > `Multiwfn` 可执行文件必须与同级的 `lib/` 文件夹保持在同一目录下。

          #### 2. Remove macOS Quarantine (if needed) / 解除安全隔离
          If downloaded via browser, macOS Gatekeeper may quarantine the binary. Run:
          ```bash
          xattr -dr com.apple.quarantine /path/to/your/Multiwfn_macOS
          ```

          #### 3. Environment Configuration / 配置环境变量
          Add the following lines to your `~/.zshrc` (replace `/path/to/your/Multiwfn_macOS` with the actual path):
          ```bash
          export Multiwfnpath=/path/to/your/Multiwfn_macOS
          export PATH=$PATH:$Multiwfnpath
          export OMP_STACKSIZE=200M
          ```
          Reload your configuration:
          ```bash
          source ~/.zshrc
          ```

          #### 4. Configuration & Run / 调整参数与运行
          Open `settings.ini` to adjust `nthreads` according to your Mac's physical CPU cores. Then invoke Multiwfn directly from any terminal:
          ```bash
          Multiwfn
          ```

          ---

          ### 📜 Copyright & Citation / 版权与引用声明

          Multiwfn is developed and maintained by **Tian Lu (卢天)**, Beijing Kein Research Center for Natural Sciences.

          If results obtained from Multiwfn are used in published academic works, you **MUST cite both of the following papers**:
          1. Tian Lu, Feiwu Chen, *J. Comput. Chem.*, **33**, 580 (2012) [DOI: 10.1002/jcc.22885](https://doi.org/10.1002/jcc.22885)
          2. Tian Lu, *J. Chem. Phys.*, **161**, 082503 (2024) [DOI: 10.1063/5.0216272](https://doi.org/10.1063/5.0216272)
          """

          with open("release_notes.md", "w") as f:
              f.write(notes)
          EOF

          gh release create v${{ env.VERSION }} Multiwfn_${{ env.VERSION }}_macOS_ARM64_noGUI.zip \
            --title "Multiwfn ${{ env.VERSION }} macOS ARM64" \
            --notes-file release_notes.md
